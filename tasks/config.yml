---

- name: Disable resolved
  ansible.builtin.systemd:
    name: systemd-resolved
    state: stopped
    enabled: false
  become: true
  when: dpkg_check_systemd_resolved.rc == 0

- name: Ensure openresolv is not installed
  ansible.builtin.apt:
    name: openresolv
    state: absent
    purge: true
    autoremove: true
  become: true

- name: Stat current resolv.conf
  ansible.builtin.stat:
    path: /etc/resolv.conf
  register: resolve_conf_file

- name: Remove symlink
  ansible.builtin.file:
    path: /etc/resolv.conf
    state: absent
  become: true
  when:
    - resolve_conf_file.stat.islnk is defined
    - resolve_conf_file.stat.islnk

- name: Configure resolv.conf
  ansible.builtin.template:
    src: resolv.conf
    dest: /etc/resolv.conf
    mode: '0644'
  become: true
