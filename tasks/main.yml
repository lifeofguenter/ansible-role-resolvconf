---

- name: Check if systemd-resolved is installed
  ansible.builtin.command: dpkg -L systemd-resolved
  register: dpkg_check_systemd_resolved
  changed_when: false
  failed_when: "'command not found' in dpkg_check_systemd_resolved.stderr"

- name: Import config.yml
  ansible.builtin.import_tasks: config.yml
  when: ansible_virtualization_type is not defined or ansible_virtualization_type not in resolv_blacklist
